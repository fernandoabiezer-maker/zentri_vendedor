name: zentri_vendedor
description: "App móvil para vendedores de HIFERCO - Zentri"
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.1
  sqflite: ^2.3.2
  path_provider: ^2.1.1
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0
  share_plus: ^9.0.0          # ✅ VUELVE A LA VERSIÓN QUE FUNCIONABA
  url_launcher: ^6.2.1
  universal_io: ^2.2.2
  local_auth: ^2.1.8
  jwt_decoder: ^2.0.1
  geolocator: ^10.1.0        # ✅ VERSIÓN ESTABLE
  auto_size_text: ^3.0.0
  connectivity_plus: 5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#1e293b"
    theme_color: "#1e293b"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48

dependency_overrides:
  geolocator_android: 4.1.8   # ✅ FORZAR VERSIÓN ESTABLE
name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"

      - name: Instalar dependencias
        run: flutter pub get

      - name: Decodificar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/zentri-upload-key.jks

      - name: Crear key.properties
        run: |
          cd android
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> key.properties
          echo "storeFile=zentri-upload-key.jks" >> key.properties

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Obtener version
        id: version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Crear release en repo APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Zentri Vendedor v${{ steps.version.outputs.version }}
          body: |
            ## Zentri Vendedor v${{ steps.version.outputs.version }}

            Compilado automaticamente desde el commit ${{ github.sha }}.
          files: build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: fernandoabiezer-maker/zentri_vendedor_apk
